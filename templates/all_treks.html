{% extends "base.html" %}
{% block title %}Arohan - Trekkers{% endblock %}




<div class="container">
{% block sidebar %}
    <a href="/trekker_dashboard"><input type="button" value="Dashboard" style="width: 290px; height: 50px; margin: 0 auto;" ></a><br>
    <a href="/all_treks"><input type="button" value="Browse Treks" style="width: 290px; height: 50px; margin: 0 auto;" disabled></a><br>
    <a href="/my_bookings"><input type="button" value="My bookings" style="width: 290px; height: 50px; margin: 0 auto;"></a><br>
    <a href="/profile_trekker"><input type="button" value="Profile" style="width: 290px; height: 50px; margin: 0 auto;"></a><br>
    <a href="/logout"><input type="button" value="Logout" style="width: 290px; height: 50px; margin: 0 auto;"></a>
{% endblock %}




{% block content %}

<h1>Treks</h1>
<input type="search" name="search" id="search" style="width: 800px; height: 30px;">
<input type="button" value="search" style="height: 30px;">
<br>
<br>

<div style="align-items: center; justify-content: center;">
<table border="1px solid black">


<tr><th>ID</th><td>Trek Name</th><th>Location</th><th>Difficulty</th><th>Slots</th><th>Status</th></tr>
{% for d in app_dict %}
<tr><td>{{d}}</td><td>{{d}}</td><td>{{d}}</td><td>{{d}}</td><td>{{d}}</td><td>{{d}}</td> </tr>
{% endfor %}


</table>


{% endblock %}
