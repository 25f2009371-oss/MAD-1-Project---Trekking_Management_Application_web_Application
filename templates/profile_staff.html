{% extends "base.html" %}
{% block title %}Arohan - Staff Profile Page{% endblock %}
{% block sidebar %}
<a href="/staff_dashboard"><input type="button" value="Dashboard" style="width: 290px; height: 50px; margin: 0 auto;"></a><br>
<a href="/staff_trek_manage"><input type="button" value="My Treks" style="width: 290px; height: 50px; margin: 0 auto;"></a><br>
<a href="/participants"><input type="button" value="Participants" style="width: 290px; height: 50px; margin: 0 auto;" ></a><br>
<a href="/profile_staff"><input type="button" value="Profile" style="width: 290px; height: 50px; margin: 0 auto;" disabled></a><br>
<a href="/logout"><input type="button" value="Logout" style="width: 290px; height: 50px; margin: 0 auto;"></a>
{% endblock %}
{% block content %}
<div class="usr-dash" style="padding: 40px;">
    <h2>Staff Profile</h2>
    <br><br>    
    <h3><b>Name:</b> {{ d.full_name }}</h3>
    <br>
    <h3><b>Email:</b> {{ d.email }}</h3>
    <br>
    <h3><b>Contact:</b> {{ d.phone }}</h3>
    <br>
    <h3 style="color: green;"><b>Status:</b> {{ d.status }}</h3>
    
    <br><br>
    <a href="/edit_profile">
    </a>
</div>
{% endblock %}
