{% extends "base.html" %}
{% block title %}Arohan - Admin{% endblock %}




{% block sidebar %}
<a href="/admin_dashboard"><input type="button" value="Dashboard" style="width: 290px; height: 50px; margin: 0 auto;"></a><br>
<a href="/manage_treks"><input type="button" value="Treks" style="width: 290px; height: 50px; margin: 0 auto;" ></a><br>
<a href="/all_staffs"><input type="button" value="Staff" style="width: 290px; height: 50px; margin: 0 auto;"disabled></a><br>
<a href="/all_users"><input type="button" value="Users" style="width: 290px; height: 50px; margin: 0 auto;"></a><br>
<a href="/bookings"><input type="button" value="Bookings" style="width: 290px; height: 50px; margin: 0 auto;"></a><br>
<a href="/logout"><input type="button" value="Logout" style="width: 290px; height: 50px; margin: 0 auto;"></a>
{% endblock %}



{% block content %}

<h1>Staff Requests

<div class="staff-status">
    <input type="button" value="Pending" style="background-color: blueviolet; color: antiquewhite;">
    <input type="button" value="Approved" style="background-color: aquamarine; color: rebeccapurple;">
    <input type="button" value="Blacklisted" style="background-color:brown; color: aliceblue;">
</div>

    </h1>

<div style="align-items: center; justify-content: center;">
<table border="1px solid black">
<tr><th>Staff ID</th><th>Name</th><th>Email</th><th>Contact</th><th>Status</th><th>Actions</th></tr>

{% for d in dct %}
<tr><td>{d.sid}</td><td>{{d.name}}</td><td>{{d.email}}</td><td>{{d.contact}}</td><td>{{d.status}}</td><td>&nbsp;<input type="button" value="Approve" style="background-color:green; color: aliceblue;">&nbsp; &nbsp;<input type="button" value="Reject" style="background-color: red; color:aliceblue">&nbsp;</td></tr>
{% endfor %}



</table>
{% endblock %}
